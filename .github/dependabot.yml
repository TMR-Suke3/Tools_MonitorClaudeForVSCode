# What gets watched for updates, and how often.
#
# Two ecosystems, because the project has two: the crates the board is built from, and the
# actions CI runs it with. An action pinned to a major tag still moves under you — Dependabot
# is what turns that into a pull request you can read rather than a change you inherit.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A release younger than a week is where a hijacked publish lives; let it age before it reaches a PR.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
    commit-message:
      # Conventional Commits, as CONTRIBUTING.md requires of everything else here.
      prefix: chore

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
