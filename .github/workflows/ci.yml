name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an advisory published against an unchanged Cargo.lock still fails a run.
  schedule:
    - cron: "23 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # C-1: the product targets Windows 11 (ADR-0002), so this is the platform the checks
    # have to be green on. Nothing is cached yet because the workspace has no dependencies;
    # add a cache step when it acquires one.
    #
    # After supply-chain, not beside it: clippy and the tests run every build script and proc
    # macro in the tree, so a lock file that adds a too-young release has to be stopped first.
    needs: supply-chain
    runs-on: windows-latest
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to point at anything, a commit
      # cannot. Dependabot still proposes updates for it, comment and all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to stay on disk for the
          # steps (and build scripts) that follow.
          persist-credentials: false

      - name: Show the toolchain
        run: |
          rustup show
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Format
        run: cargo fmt --all --check

      # `--locked`: build exactly what Cargo.lock names. Without it, a stale lock is quietly
      # re-resolved to whatever crates.io serves today, which is how an unreviewed release
      # gets into a build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # TC-48 … TC-54 live here: the palette of docs/ui-overlay.md §3.2, checked against
      # the thresholds of §3.3 (docs/test-plan.md §7.1).
      - name: Test
        run: cargo test --workspace --locked

  supply-chain:
    # What Dependabot cannot see: advisories that exist only in RustSec (no GHSA number),
    # unmaintained crates, and a dependency arriving from anywhere but crates.io.
    # deny.toml says what is checked and lists each exception with its reason.
    # Also run weekly (schedule below), because a new advisory fails a tree that did not change.
    runs-on: windows-latest
    env:
      # Pinned by version and by the SHA-256 GitHub records for the release asset, which is
      # also the value in the release's own .sha256 file. 0.20.2 rather than the newest:
      # a release younger than seven days does not go in.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base revision has to be here to diff the lock files against it.
          fetch-depth: 0

      # The package managers refuse young releases only when they resolve. A lock file
      # installed as-is (`--locked`, `--frozen-lockfile`) is never resolved, so the rule is
      # checked on the lock files: every version this change adds must be 7+ days old.
      # Nothing to compare on the weekly run, which changes no lock file.
      - name: New package versions must be at least 7 days old
        if: github.event_name != 'schedule'
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git merge-base HEAD "origin/$env:BASE_REF"
          } elseif ($env:BEFORE -and $env:BEFORE -notmatch '^0+$') { $env:BEFORE } else { 'HEAD^' }
          "base: $base"
          python -I tools/check_release_age.py --base $base --days 7 `
            --exceptions tools/release-age-exceptions.txt `
            Cargo.lock tools/tauri-cli/pnpm-lock.yaml
          if ($LASTEXITCODE -ne 0) { throw "a lock file adds a release younger than 7 days" }

      - name: Install cargo-deny
        shell: pwsh
        run: |
          $name = "cargo-deny-$env:CARGO_DENY_VERSION-x86_64-pc-windows-msvc"
          $tgz = Join-Path $env:RUNNER_TEMP "$name.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/EmbarkStudios/cargo-deny/releases/download/$env:CARGO_DENY_VERSION/$name.tar.gz" -OutFile $tgz
          $hash = (Get-FileHash $tgz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CARGO_DENY_SHA256) { throw "$name.tar.gz: SHA-256 $hash, expected $env:CARGO_DENY_SHA256" }
          # Windows' own bsdtar: a GNU tar earlier on PATH reads `C:` as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -xzf $tgz -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "could not unpack $name.tar.gz" }
          Join-Path $env:RUNNER_TEMP $name | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # `--locked`: judge the tree Cargo.lock names, not one re-resolved today.
      - name: Advisories, bans and sources
        run: cargo-deny --locked check advisories bans sources
